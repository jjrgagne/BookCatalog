name: Release

# Push a tag like v0.2.0 to build a release APK and publish it as a GitHub
# Release (and to Firebase App Distribution once its secrets are set).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.2.0 (manual runs only upload an artifact)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_APP_DISTRIBUTION: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && secrets.FIREBASE_ANDROID_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${{ inputs.version }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Release signing key (if configured)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            "bookcatalog-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: bookcatalog-${{ steps.version.outputs.name }}-apk
          path: bookcatalog-${{ steps.version.outputs.name }}.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signing="Signed with the shared test key (see docs/BUILD_AND_DEPLOY.md)."
          if [ "$HAS_RELEASE_KEY" = "true" ]; then signing="Signed with the release key."; fi
          cat > notes.md <<EOF
          **Install:** on your Android phone, open this page, download
          \`bookcatalog-${{ steps.version.outputs.name }}.apk\` and open it.
          Allow your browser to install apps if asked. Updates install over
          the previous version.

          $signing
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "bookcatalog-${{ steps.version.outputs.name }}.apk" \
            --title "BookCatalog ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --prerelease

      - name: Upload to Firebase App Distribution (if configured)
        if: env.HAS_APP_DISTRIBUTION == 'true' && github.event_name == 'push'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            "bookcatalog-${{ steps.version.outputs.name }}.apk" \
            --app "$APP_ID" \
            --groups household \
            --release-notes "BookCatalog ${{ steps.version.outputs.name }}"
