name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: bookcatalog-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Firebase CLI and test libraries
        run: |
          npm install -g firebase-tools
          npm --prefix firestore-tests install --no-save @firebase/rules-unit-testing firebase

      - name: Run rules tests against the emulator
        run: firebase emulators:exec --only firestore --project demo-bookcatalog "npm --prefix firestore-tests test"
